                                </div>
                            )}
                            
                            <div className="card">
                                <div className="card-header"><div className="card-title">{t('projectionTitle')}</div><div className="flex gap-4 text-xs items-center"><div className="flex items-center gap-1"><span>{t('growthLabel')}</span><input className="w-12 border rounded text-center" value={d.growth} onChange={e=>up('growth',null,e.target.value)}/>%</div><div className="flex items-center gap-1"><span>{t('inflationLabel')}</span><input className="w-12 border rounded text-center" value={d.inflation} onChange={e=>up('inflation',null,e.target.value)}/>%</div><div className="flex items-center gap-1 font-bold text-blue-600"><span>{t('discountRateLabel')}</span><input className="w-12 border rounded text-center" value={d.discountRate} onChange={e=>up('discountRate',null,e.target.value)}/>%</div></div></div>
                                <div className="overflow-x-auto custom-scroll mb-2">
                                    <table className="w-full text-xs text-right border-collapse min-w-[800px]"><thead className="bg-indigo-900 text-white"><tr><th className="p-3 text-center">{t('pyYear')}</th><th className="p-3">{t('pyRev')}</th><th className="p-3 text-red-300">{t('pyExp')}</th><th className="p-3 font-bold text-yellow-300">{t('pyEbitda')}</th><th className="p-3 text-slate-300">{t('pyDep')}</th><th className="p-3 text-orange-300">{t('pyTax')}</th><th className="p-3 font-bold text-blue-300 bg-indigo-800">{t('pyNet')}</th><th className="p-3 text-green-300">{t('pyDiv')}</th><th className="p-3 font-bold text-green-400 bg-indigo-950">{t('pyCashEnd')}</th></tr></thead>

                            {/* Professional Business Analysis - Detailed Version */}
                            <div className="card mt-6 border-purple-300 shadow-lg bg-gradient-to-br from-purple-50 to-blue-50">
                                <div className="card-header bg-gradient-to-r from-purple-600 to-blue-600 text-white">
                                    <div className="card-title text-white flex items-center gap-2">
                                        <span className="text-2xl">📋</span>
                                        <span>{t('businessAnalysis')}</span>
                                    </div>
                                </div>
                                <div className="card-body p-4 space-y-4">
                                    {(() => {
                                        // Calculate Business Viability Score (0-100)
                                        let viabilityScore = 0;
                                        let scoreFactors = [];
                                        
                                        // 1. Profitability (30 points)
                                        if (c.netProfit > 0) {
                                            const profitScore = Math.min(30, (c.netProfit / 1000000) * 30);
                                            viabilityScore += profitScore;
                                            scoreFactors.push({ name: 'Profitability', score: profitScore, max: 30 });
                                        }
                                        
                                        // 2. Margins (20 points)
                                        const marginScore = Math.min(20, (c.netMargin / 20) * 20);
                                        viabilityScore += marginScore;
                                        scoreFactors.push({ name: 'Margins', score: marginScore, max: 20 });
                                        
                                        // 3. Cash Flow (20 points)
                                        const cashScore = c.lowestCashBalance >= 0 ? 20 : Math.max(0, 20 + (c.lowestCashBalance / 100000));
                                        viabilityScore += cashScore;
                                        scoreFactors.push({ name: 'Cash Flow', score: cashScore, max: 20 });
                                        
                                        // 4. DSCR (15 points)
                                        const dscrScore = c.dscr >= 1.25 ? 15 : (c.dscr >= 1 ? 10 : Math.max(0, c.dscr * 10));
                                        viabilityScore += dscrScore;
                                        scoreFactors.push({ name: 'Debt Service', score: dscrScore, max: 15 });
                                        
                                        // 5. ROAS/Marketing Efficiency (15 points)
                                        const roasScore = Math.min(15, (c.funnelMetrics.roas / 5) * 15);
                                        viabilityScore += roasScore;
                                        scoreFactors.push({ name: 'Marketing Efficiency', score: roasScore, max: 15 });
                                        
                                        viabilityScore = Math.max(0, Math.min(100, viabilityScore));
                                        
                                        // Determine viability level
                                        let viabilityLevel = '';
                                        let viabilityColor = '';
                                        if (viabilityScore >= 80) {
                                            viabilityLevel = t('excellent');
                                            viabilityColor = 'text-green-600';
                                        } else if (viabilityScore >= 60) {
                                            viabilityLevel = t('good');
                                            viabilityColor = 'text-blue-600';
                                        } else if (viabilityScore >= 40) {
                                            viabilityLevel = t('fair');
                                            viabilityColor = 'text-yellow-600';
                                        } else if (viabilityScore >= 20) {
                                            viabilityLevel = t('poor');
                                            viabilityColor = 'text-orange-600';
                                        } else {
                                            viabilityLevel = t('critical');
                                            viabilityColor = 'text-red-600';
                                        }
                                        
                                        // Analyze Strengths
                                        const strengths = [];
                                        if (c.netProfit > 0) strengths.push(lang === 'th' ? `กำไรสุทธิ ${fmt(c.netProfit)} บาท แสดงความสามารถในการทำกำไร` : `净利润 ${fmt(c.netProfit)} 泰铢，显示盈利能力`);
                                        if (c.netMargin > 15) strengths.push(lang === 'th' ? `Net Margin ${(c.netMargin || 0).toFixed(1)}% สูง แสดงประสิทธิภาพการจัดการต้นทุนดี` : `Net Margin ${(c.netMargin || 0).toFixed(1)}% 高，显示成本管理效率`);
                                        if (c.grossMargin > 30) strengths.push(lang === 'th' ? `Gross Margin ${(c.grossMargin || 0).toFixed(1)}% สูง แสดงความสามารถในการแข่งขัน` : `Gross Margin ${(c.grossMargin || 0).toFixed(1)}% 高，显示竞争力`);
                                        if (c.funnelMetrics.roas >= 5) strengths.push(lang === 'th' ? `ROAS ${(c.funnelMetrics.roas || 0).toFixed(2)}x ยอดเยี่ยม แสดงประสิทธิภาพการตลาดดี` : `ROAS ${(c.funnelMetrics.roas || 0).toFixed(2)}x 优秀，显示营销效率`);
                                        if (c.dscr >= 1.25) strengths.push(lang === 'th' ? `DSCR ${(c.dscr || 0).toFixed(2)} สูง แสดงความสามารถในการจ่ายหนี้ดี` : `DSCR ${(c.dscr || 0).toFixed(2)} 高，显示偿债能力强`);
                                        if (c.lowestCashBalance >= 0) strengths.push(lang === 'th' ? `กระแสเงินสดเป็นบวกตลอด แสดงสภาพคล่องดี` : `现金流始终为正，显示流动性良好`);
                                        if (projection && projection.npv > 0) strengths.push(lang === 'th' ? `NPV ${fmt(projection.npv)} บาท แสดงมูลค่าทางเศรษฐกิจดี` : `NPV ${fmt(projection.npv)} 泰铢，显示经济价值良好`);
                                        
                                        // Analyze Weaknesses
                                        const weaknesses = [];
                                        if (c.netProfit <= 0) weaknesses.push(lang === 'th' ? `ยังขาดทุน ${fmt(Math.abs(c.netProfit))} บาท ต้องปรับปรุง` : `仍亏损 ${fmt(Math.abs(c.netProfit))} 泰铢，需要改进`);
                                        if (c.netMargin < 5) weaknesses.push(lang === 'th' ? `Net Margin ${(c.netMargin || 0).toFixed(1)}% ต่ำ ต้องเพิ่มประสิทธิภาพ` : `Net Margin ${(c.netMargin || 0).toFixed(1)}% 低，需要提高效率`);
                                        if (c.grossMargin < 20) weaknesses.push(lang === 'th' ? `Gross Margin ${(c.grossMargin || 0).toFixed(1)}% ต่ำ ต้นทุนสูงเกินไป` : `Gross Margin ${(c.grossMargin || 0).toFixed(1)}% 低，成本过高`);
                                        if (c.funnelMetrics.roas < 3) weaknesses.push(lang === 'th' ? `ROAS ${(c.funnelMetrics.roas || 0).toFixed(2)}x ต่ำ ประสิทธิภาพการตลาดต้องปรับปรุง` : `ROAS ${(c.funnelMetrics.roas || 0).toFixed(2)}x 低，营销效率需要改进`);
                                        if (c.dscr < 1) weaknesses.push(lang === 'th' ? `DSCR ${(c.dscr || 0).toFixed(2)} ต่ำกว่า 1 ไม่สามารถจ่ายหนี้ได้` : `DSCR ${(c.dscr || 0).toFixed(2)} 低于 1，无法偿还债务`);
                                        if (c.lowestCashBalance < 0) weaknesses.push(lang === 'th' ? `กระแสเงินสดติดลบ ${fmt(Math.abs(c.lowestCashBalance))} บาท มีความเสี่ยง` : `现金流为负 ${fmt(Math.abs(c.lowestCashBalance))} 泰铢，存在风险`);
                                        if (projection && projection.npv < 0) weaknesses.push(lang === 'th' ? `NPV ติดลบ แสดงมูลค่าทางเศรษฐกิจไม่ดี` : `NPV 为负，显示经济价值不佳`);
                                        
                                        // Risk Assessment
                                        const risks = [];
                                        if (c.netProfit <= 0) risks.push({ level: 'high', text: lang === 'th' ? 'ความเสี่ยงขาดทุนสูง ต้องปรับปรุงทันที' : '亏损风险高，需要立即改进' });
                                        if (c.lowestCashBalance < 0) risks.push({ level: 'high', text: lang === 'th' ? 'ความเสี่ยงสภาพคล่อง ต้องระวังการเงิน' : '流动性风险，需要谨慎财务' });
                                        if (c.dscr < 1) risks.push({ level: 'critical', text: lang === 'th' ? 'ความเสี่ยงการจ่ายหนี้ ต้องแก้ไขเร่งด่วน' : '偿债风险，需要紧急解决' });
                                        if (c.netMargin < 5) risks.push({ level: 'medium', text: lang === 'th' ? 'ความเสี่ยงกำไรต่ำ ต้องเพิ่มประสิทธิภาพ' : '利润低风险，需要提高效率' });
                                        if (c.funnelMetrics.roas < 3) risks.push({ level: 'medium', text: lang === 'th' ? 'ความเสี่ยงประสิทธิภาพการตลาดต่ำ' : '营销效率低风险' });
                                        if (d.targetBags < c.bepUnits) risks.push({ level: 'medium', text: lang === 'th' ? `ยอดขาย ${fmt(d.targetBags)} ถุง ต่ำกว่า BEP ${fmt(c.bepUnits)} ถุง` : `销售额 ${fmt(d.targetBags)} 袋低于 BEP ${fmt(c.bepUnits)} 袋` });
                                        
                                        // Strategic Recommendations
                                        const recommendations = [];
                                        if (c.netProfit <= 0) {
                                            recommendations.push(lang === 'th' ? '🔴 เร่งด่วน: เพิ่มยอดขายหรือลดต้นทุนเพื่อให้มีกำไร' : '🔴 紧急：增加销售额或降低成本以实现盈利');
                                        }
                                        if (c.netMargin < 10) {
                                            recommendations.push(lang === 'th' ? '📈 เพิ่มราคาขายหรือลดต้นทุนเพื่อเพิ่ม Net Margin' : '📈 提高售价或降低成本以增加 Net Margin');
                                        }
                                        if (c.funnelMetrics.roas < 4) {
                                            recommendations.push(lang === 'th' ? '📢 ปรับปรุงประสิทธิภาพการตลาด เพิ่ม CTR/CVR หรือลด CPM' : '📢 改进营销效率，提高 CTR/CVR 或降低 CPM');
                                        }
                                        if (c.lowestCashBalance < 0) {
                                            recommendations.push(lang === 'th' ? '💰 จัดการกระแสเงินสด ระวังการเงินหมุนเวียน' : '💰 管理现金流，注意营运资金');
                                        }
                                        if (c.dscr < 1.25) {
                                            recommendations.push(lang === 'th' ? '💳 เพิ่ม EBITDA หรือลดหนี้เพื่อปรับปรุง DSCR' : '💳 增加 EBITDA 或减少债务以改善 DSCR');
                                        }
                                        if (d.targetBags < c.bepUnits) {
                                            recommendations.push(lang === 'th' ? `🎯 เพิ่มยอดขายให้ถึง ${fmt(c.bepUnits)} ถุง/เดือน เพื่อ Break-even` : `🎯 增加销售额至 ${fmt(c.bepUnits)} 袋/月以达到盈亏平衡`);
                                        }
                                        if (viabilityScore >= 80) {
                                            recommendations.push(lang === 'th' ? '✅ โมเดลธุรกิจแข็งแรง พร้อมขยายธุรกิจ' : '✅ 商业模式强劲，准备扩展业务');
                                        }
                                        
                                        return (
                                            <>
                                                {/* Viability Score */}
                                                <div className="bg-white rounded-lg p-4 border-2 border-purple-200 shadow-md">
                                                    <div className="flex items-center justify-between mb-3">
                                                        <h4 className="font-bold text-lg text-purple-700">{t('viabilityScore')}</h4>
                                                        <div className={`text-3xl font-bold ${viabilityColor}`}>{viabilityScore.toFixed(0)}/100</div>
                                                    </div>
                                                    <div className="w-full bg-gray-200 rounded-full h-4 mb-2">
                                                        <div 
                                                            className={`h-4 rounded-full transition-all ${
                                                                viabilityScore >= 80 ? 'bg-green-500' : 
                                                                viabilityScore >= 60 ? 'bg-blue-500' : 
                                                                viabilityScore >= 40 ? 'bg-yellow-500' :
